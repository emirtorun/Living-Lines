<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Animated Comic Generator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .comic-frame-fadeIn {
            animation: fadeIn 0.8s ease-out forwards;
        }
        .comic-frame-slideIn {
            animation: slideIn 0.8s ease-out forwards;
        }
        .comic-frame-zoomIn {
            animation: zoomIn 0.8s ease-out forwards;
        }
        .speech-bubble {
            position: relative;
            background: white;
            border: 3px solid #9333ea;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 0 0 3px rgba(147, 51, 234, 0.1);
        }
        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 30px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid #9333ea;
        }
        .speech-bubble:before {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 32px;
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 13px solid white;
            z-index: 1;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #9333ea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        .success-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        .info-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============= API INTEGRATION FUNCTIONS =============
        
        const analyzeCharacter = async (imageBase64, apiKey) => {
            console.log("Analyzing character with GPT-4 Vision...");
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{
                        role: "user",
                        content: [{
                            type: "text",
                            text: `Analyze this child's drawing and extract a detailed character description. Focus on:
                            - Physical appearance: colors, shapes, body type, clothing
                            - Facial features: eyes, mouth, expression
                            - Accessories or unique features
                            - Art style: cartoon/simple/sketch
                            - Implied personality traits
                            
                            Provide a concise, structured description (2-3 sentences) suitable for consistent AI image generation.`
                        }, {
                            type: "image_url",
                            image_url: { url: imageBase64 }
                        }]
                    }],
                    max_tokens: 300
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(`OpenAI Vision API error: ${error.error?.message || response.statusText}`);
            }
            
            const data = await response.json();
            console.log("Character analysis:", data.choices[0].message.content);
            return data.choices[0].message.content;
        };

        const refineCharacter = async (originalImage, characterDescription, apiKey) => {
            console.log("Refining character with Runware...");
            
            // Extract base64 data if it includes data URL prefix
            let imageData = originalImage;
            if (originalImage.includes('base64,')) {
                imageData = originalImage.split('base64,')[1];
            }
            
            const response = await fetch("https://api.runware.ai/v1", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify([{
                    taskType: "imageInference",
                    taskUUID: crypto.randomUUID(),
                    inputImage: imageData,
                    model: "runware:100@1", // SDXL model
                    positivePrompt: `children's comic book character, ${characterDescription}, vibrant colors, clean bold black outlines, cartoon style, professional illustration, simple shapes, kid-friendly`,
                    negativePrompt: "realistic, photorealistic, scary, dark, violent, complex details, messy, blurry, adult content",
                    strength: 0.40, // Preserve original while making it comic-ready
                    width: 768,
                    height: 768,
                    numberResults: 1,
                    outputType: "URL",
                    outputFormat: "PNG"
                }])
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Runware API error: ${errorText}`);
            }
            
            const data = await response.json();
            console.log("Character refined:", data.data[0].imageURL);
            return data.data[0].imageURL;
        };

        const generateStoryBeats = async (characterDescription, characterName, previousContext, storyMemory, apiKey) => {
            console.log("📝 Generating story with GPT-4...");
            
            const isFirstScene = previousContext.length === 0;
            
            let contextPrompt = '';
            if (isFirstScene) {
                contextPrompt = 'Start a magical adventure! Introduce the setting and an initial goal.';
            } else {
                // Build rich context from memory
                const memoryContext = [];
                if (storyMemory.location) memoryContext.push(`Currently at: ${storyMemory.location}`);
                if (storyMemory.goal) memoryContext.push(`Current goal: ${storyMemory.goal}`);
                if (storyMemory.characters.length > 0) memoryContext.push(`Characters met: ${storyMemory.characters.join(', ')}`);
                if (storyMemory.events.length > 0) memoryContext.push(`Recent events: ${storyMemory.events.slice(-3).join(' → ')}`);
                
                contextPrompt = `STORY CONTEXT:
${memoryContext.join('\n')}

PLAYER'S CHOICE: "${previousContext[previousContext.length - 1]}"

Continue the story based on this choice. Keep narrative consistency!`;
            }
            
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{
                        role: "system",
                        content: `You create magical adventure stories for children (ages 6-12) in an interactive storybook format.

CRITICAL ANIMATION RULES:
- We are animating a STATIC drawing that CANNOT change poses or transform
- Scene descriptions must focus on ENVIRONMENT and ATMOSPHERE only
- Provide DETAILED but FOCUSED descriptions (20-30 words ideal)
- Include specific visual details: colors, lighting, objects, weather, atmosphere

STORY CONSISTENCY:
- Remember all characters introduced previously
- Follow the narrative thread from player's choices
- Introduce NEW characters naturally (friends, magical creatures, helpers)
- When introducing NEW characters, give them dialogue that introduces themselves or helps the story
- Build on previous events and locations
- Maintain continuity of the adventure

For each scene, provide:
1. NARRATOR TEXT: Beautiful prose (2-3 sentences, children's book style)
2. CHARACTER DIALOGUE: What ${characterName} says (enthusiastic, age-appropriate)
3. NEW CHARACTER DIALOGUE: If a new character appears, what they say (friendly, helpful, engaging)
4. SCENE DESCRIPTION: Detailed ENVIRONMENT description (20-30 words, vivid but focused)
5. STORY METADATA: Update story memory (location, characters, events, goal)

Scene description examples (BALANCED DETAIL):
✅ "enchanted forest with towering ancient trees, glowing purple mushrooms, golden fireflies dancing in misty air, soft rainbow light filtering through leaves"
✅ "crystal cave with shimmering blue walls, sparkling stalactites, pools of glowing water reflecting rainbow lights, magical gems embedded in rocks"
✅ "sunny meadow filled with colorful wildflowers, butterflies with glittering wings, white puffy clouds in bright blue sky, gentle breeze"
✅ "mystical mountain peak with swirling silver clouds, floating islands nearby, cascading waterfalls of stardust, pink and orange sunset sky"

❌ "magical forest" (too simple, no visual details, background won't render properly)
❌ "jumping over a rainbow" (character action, not environment)
❌ "running through enchanted forest with ancient trees covered in glowing moss while collecting magical crystals and meeting fairy friends who guide the way to a hidden treasure chest beneath sparkling waterfalls" (too long, includes actions)

Return ONLY valid JSON:
{
  "scenes": [
    {
      "narrator": "Story text (2-3 sentences)",
      "dialogue": "What ${characterName} says!",
      "newCharacterDialogue": "What new character says (if introduced), or null",
      "sceneDescription": "Detailed environment (20-30 words, vivid visual details)"
    }
  ],
  "choices": ["Choice 1 ✨", "Choice 2 🌟", "Choice 3 💫"],
  "storyUpdate": {
    "location": "current location name",
    "newCharacter": "name of new character if introduced, or null",
    "newCharacterDescription": "brief appearance description if new character introduced, or null",
    "event": "what just happened (brief)",
    "goal": "current objective"
  }
}`
                    }, {
                        role: "user",
                        content: `Create the next scene for ${characterName}'s adventure.

${contextPrompt}

Requirements:
1. NARRATOR: Engaging children's book prose (2-3 sentences)
2. DIALOGUE: What ${characterName} says (excited/curious/brave)
3. NEW CHARACTER DIALOGUE: If introducing a new character, give them dialogue (friendly greeting or helpful comment)
4. SCENE DESCRIPTION: Detailed ENVIRONMENT with vivid visual details (20-30 words)
   - Include: colors, lighting, specific objects, weather, atmosphere
   - Focus on: what's visible in the background and surroundings
   - Avoid: character actions or movements
5. STORY UPDATE: Update location, introduce new character with description if appropriate, record event, update goal
6. CHOICES: 3 meaningful options that advance the story

SCENE DESCRIPTION MUST INCLUDE:
- Specific colors (golden, emerald, crystal blue, etc.)
- Lighting/atmosphere (glowing, shimmering, misty, sunny, etc.)
- Environmental objects (trees, rocks, flowers, clouds, water, etc.)
- Mood elements (magical, peaceful, mysterious, exciting, etc.)

Examples:
✅ "ancient forest with towering oak trees covered in glowing moss, golden fireflies floating through purple mist, soft moonlight breaking through branches"
✅ "crystal cave with walls of sparkling blue ice, stalactites dripping rainbow water into glowing pools, magical gems reflecting prismatic light"
✅ "mountain meadow filled with wildflowers in every color, butterflies with translucent wings, white clouds drifting across bright azure sky"

${isFirstScene ? `
This is the FIRST scene, so:
- Set up the initial magical setting with RICH VISUAL DETAILS
- Describe the environment vividly so it renders properly
- Introduce a clear goal or mystery
- Make it exciting and inviting
` : `
This is a CONTINUATION, so:
- Build directly from the player's choice
- Maintain consistency with previous events
- If introducing a NEW CHARACTER, give them dialogue that introduces themselves or offers help
- Describe the NEW LOCATION with rich visual details (if location changed)
- Keep the adventure progressing with clear environmental context
`}

Generate the story now!`
                    }],
                    response_format: { type: "json_object" },
                    temperature: 0.8,
                    max_tokens: 1500
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(`Story generation failed: ${error.error?.message || response.statusText}`);
            }
            
            const data = await response.json();
            const story = JSON.parse(data.choices[0].message.content);
            console.log("✅ Story generated:", story);
            return story;
        };

        const uploadImageForVideo = async (imageDataURI, apiKey) => {
            console.log("📤 Uploading image to Runware...");
            
            // Extract base64 data if it's a data URI
            let imageData = imageDataURI;
            if (imageDataURI.includes('base64,')) {
                imageData = imageDataURI.split('base64,')[1];
            }
            
            const response = await fetch("https://api.runware.ai/v1", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify([{
                    taskType: "imageUpload",
                    taskUUID: crypto.randomUUID(),
                    image: imageData  // Base64 data
                }])
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Image upload failed: ${errorText}`);
            }
            
            const data = await response.json();
            
            if (data.errors && data.errors.length > 0) {
                throw new Error(`Upload error: ${data.errors[0].message}`);
            }
            
            const imageUUID = data.data[0].imageUUID;
            console.log("✅ Image uploaded, UUID:", imageUUID);
            
            return imageUUID;
        };

        const generateAnimatedFrame = async (sceneDescription, characterUUID, apiKey) => {
            console.log("🎬 Generating animated video for scene:", sceneDescription);
            
            const taskUUID = crypto.randomUUID();
            
            // Determine if we're using image-to-video or text-to-video
            const useImageMode = characterUUID !== null;
            
            // Build request body
            const requestBody = {
                taskType: "videoInference",
                taskUUID: taskUUID,
                model: "bytedance:2@2", // Seedance 1.0 Pro Fast
                duration: 5,  // 5 seconds
                width: 1440,  // Square format
                height: 1440,
                providerSettings: {
                    bytedance: {
                        cameraFixed: true  // ✅ LOCK CAMERA to prevent morphing
                    }
                },
                numberResults: 1,
                outputType: "URL",
                outputFormat: "MP4",
                deliveryMethod: "async"
            };
            
            if (useImageMode) {
                // IMAGE-TO-VIDEO MODE: Use minimal motion prompt to prevent morphing
                // CRITICAL: Only describe motion/atmosphere, NOT the character itself
                const motionPrompt = `
                EXTREMELY IMPORTANT — DO NOT ALTER DRAWING STYLE OR CHARACTER DESIGN.
                Keep identical proportions, line thickness, colors, and face expression.
                The animation must look like the original 2D hand-drawn frame came alive,
                not a redraw, morph, or 3D version.

                Animate minimally but purposefully:
                - Maintain a locked camera and fixed framing.
                - Subtle parallax or layer depth is allowed (sky, background, effects).
                - Add small believable motions: hair sway, blinking, breathing, floating dust, light flicker, waving plants, small ambient reactions to ${sceneDescription}.
                - Keep total motion under 15% pixel displacement of any drawn object.

                Style reference:
                - Flat 2D cartoon aesthetic
                - Clean pen outlines and solid colors
                - Preserve every stroke from input drawing exactly

                Scene atmosphere to animate around the drawing:
                ${sceneDescription}
                `;
                console.log("✅ IMAGE-TO-VIDEO mode (Animate Original Drawing)");
                console.log("Character locked as first frame (UUID):", characterUUID);
                console.log("Minimal motion prompt:", motionPrompt);
                
                requestBody.frameImages = [{
                    inputImage: characterUUID,
                    frame: "first"
                }];
                
                // Minimal prompt - just motion and scene atmosphere
                requestBody.positivePrompt = motionPrompt;
                
                // Note: negativePrompt is NOT supported for video models
                
            } else {
                // TEXT-TO-VIDEO MODE: Use full text prompt
                const textPrompt = `children's comic book animation, ${sceneDescription}, vibrant colors, bold outlines, dynamic movement, cartoon style, professional comic art style`;
                
                console.log("✅ TEXT-TO-VIDEO mode");
                console.log("Text prompt:", textPrompt);
                
                requestBody.positivePrompt = textPrompt;
            }
            
            console.log("Request body:", JSON.stringify(requestBody, null, 2));
            
            const response = await fetch("https://api.runware.ai/v1", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify([requestBody])
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Video generation failed: ${errorText}`);
            }
            
            const initialData = await response.json();
            
            // Check for immediate errors
            if (initialData.errors && initialData.errors.length > 0) {
                const error = initialData.errors[0];
                throw new Error(`API Error: ${error.message}`);
            }
            
            console.log("✅ Video generation started, polling for result...");
            
            // Poll for video completion
            return await pollForVideoResult(taskUUID, apiKey);
        };

        const pollForVideoResult = async (taskUUID, apiKey, maxAttempts = 60) => {
            // Poll every 5 seconds for up to 5 minutes
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 5000)); // Wait 5 seconds
                
                const response = await fetch("https://api.runware.ai/v1", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify([{
                        taskType: "getResponse",
                        taskUUID: taskUUID
                    }])
                });
                
                if (!response.ok) {
                    console.warn(`Poll attempt ${attempt + 1} failed, retrying...`);
                    continue;
                }
                
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    const result = data.data[0];
                    
                    if (result.status === "success" && result.videoURL) {
                        console.log("Video generated successfully:", result.videoURL);
                        return result.videoURL;
                    } else if (result.status === "failed") {
                        throw new Error(`Video generation failed: ${result.error || 'Unknown error'}`);
                    } else if (result.status === "processing") {
                        console.log(`Video processing... (attempt ${attempt + 1}/${maxAttempts})`);
                        continue;
                    }
                }
            }
            
            throw new Error("Video generation timed out after 5 minutes");
        };

        // ============= TOAST NOTIFICATION COMPONENT =============
        
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    onClose();
                }, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const className = type === 'error' ? 'error-toast' 
                : type === 'success' ? 'success-toast' 
                : 'info-toast';

            return (
                <div className={className}>
                    <div className="flex items-center gap-2">
                        <span>{message}</span>
                        <button onClick={onClose} className="ml-4 font-bold">×</button>
                    </div>
                </div>
            );
        };

        // ============= MAIN APP COMPONENT =============
        
        const App = () => {
            const [apiKeys, setApiKeys] = useState({ 
                openai: , 
                runware: 
            });
            const [characterImage, setCharacterImage] = useState(null);
            const [characterName, setCharacterName] = useState('');
            const [characterDescription, setCharacterDescription] = useState('');
            const [frames, setFrames] = useState([]);
            const [choices, setChoices] = useState([]);
            const [loading, setLoading] = useState(false);
            const [currentScreen, setCurrentScreen] = useState('story'); // Start directly on story screen for testing
            const [toast, setToast] = useState(null);
            const [loadingMessage, setLoadingMessage] = useState('');
            const [characterData, setCharacterData] = useState(null);
            const [storyContext, setStoryContext] = useState([]);
            const [storyMemory, setStoryMemory] = useState({
                characters: [],  // Track all characters introduced
                events: [],      // Major story events
                location: '',    // Current location
                goal: ''         // Current objective
            });

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setCharacterImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const startAdventure = async () => {
                const testCharacterName = characterName || 'Figure';
                const defaultDescription = 'magical adventure';
                
                setLoading(true);
                setCurrentScreen('story');

                try {
                    let characterUUID = null;
                    let useImageMode = false;
                    
                    if (characterImage) {
                        // IMAGE-TO-VIDEO MODE: Upload ORIGINAL drawing (no refinement!)
                        setLoadingMessage('� Uploading your character drawing...');
                        characterUUID = await uploadImageForVideo(characterImage, apiKeys.runware);
                        useImageMode = true;
                        
                        console.log("✅ Image-to-video mode: Original drawing will animate");
                    } else {
                        // TEXT-TO-VIDEO MODE: Use text description only
                        setLoadingMessage('✏️ Using text-to-video mode...');
                        console.log("Text-to-video mode: Will use text prompt only");
                    }
                    
                    // Store character data (with UUID for reuse)
                    const charData = {
                        characterUUID: characterUUID,
                        name: testCharacterName,
                        useImageMode: useImageMode
                    };
                    setCharacterData(charData);
                    
                    // Initialize story memory
                    const initialMemory = {
                        characters: [testCharacterName],
                        events: [],
                        location: '',
                        goal: ''
                    };
                    
                    // Generate initial story
                    setLoadingMessage('📖 Creating your adventure story...');
                    const story = await generateStoryBeats(
                        characterDescription || defaultDescription,
                        testCharacterName,
                        [],
                        initialMemory,
                        apiKeys.openai
                    );
                    
                    // Update story memory with first scene
                    const updatedMemory = {
                        characters: [testCharacterName],
                        events: [story.storyUpdate?.event || 'Adventure begins'],
                        location: story.storyUpdate?.location || 'Unknown land',
                        goal: story.storyUpdate?.goal || 'Explore the world'
                    };
                    if (story.storyUpdate?.newCharacter) {
                        updatedMemory.characters.push(story.storyUpdate.newCharacter);
                    }
                    setStoryMemory(updatedMemory);
                    
                    // Generate animated video frame
                    const scene = story.scenes[0];
                    const mode = useImageMode ? 'image-to-video' : 'text-to-video';
                    setLoadingMessage(`🎬 Animating scene 1/1 (${mode}, ~30-60 seconds)...`);
                    
                    const frameVideo = await generateAnimatedFrame(
                        scene.sceneDescription || scene.description,  // Use sceneDescription for animation
                        characterUUID,      // Character UUID (or null for text mode)
                        apiKeys.runware
                    );
                    
                    const generatedFrames = [{
                        id: '1',
                        videoUrl: frameVideo,
                        narrator: scene.narrator || '',
                        dialogue: scene.dialogue || '',
                        newCharacterDialogue: scene.newCharacterDialogue || null,
                        newCharacterName: story.storyUpdate?.newCharacter || null,
                        sceneDescription: scene.sceneDescription || scene.description,
                        animation: "fadeIn"
                    }];
                    
                    setFrames(generatedFrames);
                    setChoices(story.choices.map((choice, idx) => ({ id: `c${idx}`, text: choice })));
                    showToast(`✨ Your ${mode} adventure is ready!`, 'success');
                    
                } catch (error) {
                    console.error("Error generating adventure:", error);
                    showToast(`Failed: ${error.message}`, 'error');
                    setCurrentScreen('story');
                } finally {
                    setLoading(false);
                    setLoadingMessage('');
                }
            };

            const handleChoiceClick = async (choiceText) => {
                if (loading || !characterData) return;

                console.log(`🎯 Player chose: "${choiceText}"`);
                setLoading(true);
                const newContext = [...storyContext, choiceText];
                setStoryContext(newContext);

                try {
                    // Generate next story beat with memory context
                    setLoadingMessage('📖 Continuing your adventure...');
                    const story = await generateStoryBeats(
                        '',  // Don't need character description for continuation
                        characterData.name,
                        newContext,
                        storyMemory,  // Pass current story memory
                        apiKeys.openai
                    );

                    // Update story memory with new information
                    const updatedMemory = { ...storyMemory };
                    if (story.storyUpdate) {
                        if (story.storyUpdate.location) {
                            updatedMemory.location = story.storyUpdate.location;
                        }
                        if (story.storyUpdate.event) {
                            updatedMemory.events = [...updatedMemory.events, story.storyUpdate.event];
                        }
                        if (story.storyUpdate.goal) {
                            updatedMemory.goal = story.storyUpdate.goal;
                        }
                        if (story.storyUpdate.newCharacter && !updatedMemory.characters.includes(story.storyUpdate.newCharacter)) {
                            updatedMemory.characters = [...updatedMemory.characters, story.storyUpdate.newCharacter];
                            const charDesc = story.storyUpdate.newCharacterDescription || '';
                            console.log(`✨ New character introduced: ${story.storyUpdate.newCharacter}${charDesc ? ` (${charDesc})` : ''}`);
                        }
                    }
                    setStoryMemory(updatedMemory);
                    
                    console.log("📚 Story memory updated:", updatedMemory);

                    // Generate new video with SAME character
                    const scene = story.scenes[0];
                    if (!scene) {
                        throw new Error("No scene data returned from story generation");
                    }
                    
                    const mode = characterData.useImageMode ? 'image-to-video' : 'text-to-video';
                    setLoadingMessage(`🎬 Animating new scene (${mode}, ~30-60 seconds)...`);
                    
                    const sceneDesc = scene.sceneDescription || scene.description;
                    if (!sceneDesc) {
                        throw new Error("No scene description available for animation");
                    }
                    
                    console.log(`🎬 Animating scene: "${sceneDesc}"`);
                    
                    const frameVideo = await generateAnimatedFrame(
                        sceneDesc,
                        characterData.characterUUID,  // SAME character UUID (or null)
                        apiKeys.runware
                    );
                    
                    const newFrame = {
                        id: `${Date.now()}`,
                        videoUrl: frameVideo,
                        narrator: scene.narrator || '',
                        dialogue: scene.dialogue || '',
                        newCharacterDialogue: scene.newCharacterDialogue || null,
                        newCharacterName: story.storyUpdate?.newCharacter || null,
                        sceneDescription: sceneDesc,
                        animation: "fadeIn"
                    };

                    console.log("✅ New frame created:", newFrame);
                    
                    // Log new character dialogue if present
                    if (scene.newCharacterDialogue) {
                        console.log(`💬 New character speaks: "${scene.newCharacterDialogue}"`);
                    }

                    // Update frames and choices
                    setFrames(prevFrames => [...prevFrames, newFrame]);
                    
                    if (story.choices && story.choices.length > 0) {
                        const newChoices = story.choices.map((choice, idx) => ({ 
                            id: `c${Date.now()}-${idx}`, 
                            text: choice 
                        }));
                        setChoices(newChoices);
                        console.log("✅ New choices set:", newChoices);
                    } else {
                        console.warn("⚠️ No choices returned from story generation");
                        setChoices([]);
                    }
                    
                    showToast('✨ New scene added!', 'success');

                } catch (error) {
                    console.error("Error continuing story:", error);
                    showToast(`Failed: ${error.message}`, 'error');
                } finally {
                    setLoading(false);
                    setLoadingMessage('');
                }
            };

            return (
                <div className="min-h-screen p-8">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-purple-900 mb-2">
                                🎬 AI-Powered Animated Comic Generator
                            </h1>
                            <p className="text-gray-600">
                                Upload your drawing and watch it come to life in an interactive adventure!
                            </p>
                            <p className="text-sm text-purple-600 mt-2">
                                ✨ Your original drawing animates in each scene • Perfect character consistency!
                            </p>
                        </div>

                        {currentScreen === 'setup' ? (
                            /* Setup Screen */
                            <div className="bg-white rounded-xl shadow-xl p-8 space-y-6">
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-900 mb-4">API Configuration</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                OpenAI API Key (required for GPT-4 Vision & Story Generation)
                                            </label>
                                            <input
                                                type="password"
                                                value={apiKeys.openai}
                                                onChange={(e) => setApiKeys({...apiKeys, openai: e.target.value})}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                placeholder="sk-..."
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Runware API Key (required for Image Generation)
                                            </label>
                                            <input
                                                type="password"
                                                value={apiKeys.runware}
                                                onChange={(e) => setApiKeys({...apiKeys, runware: e.target.value})}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                placeholder="Enter Runware API key"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <hr className="my-6" />

                                <div>
                                    <h2 className="text-2xl font-bold text-gray-900 mb-4">Character Setup</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Upload Your Character Drawing
                                            </label>
                                            <input
                                                type="file"
                                                accept="image/*"
                                                onChange={handleImageUpload}
                                                className="w-full px-4 py-2 border border-purple-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100"
                                            />
                                            {characterImage && (
                                                <div className="mt-4">
                                                    <img src={characterImage} alt="Your character" className="w-48 h-48 object-contain border-2 border-purple-300 rounded-lg" />
                                                </div>
                                            )}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Character Name
                                            </label>
                                            <input
                                                type="text"
                                                value={characterName}
                                                onChange={(e) => setCharacterName(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                placeholder="e.g., Sparky the Dragon"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <button
                                    onClick={startAdventure}
                                    disabled={loading}
                                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-lg font-bold text-lg hover:from-purple-700 hover:to-pink-700 transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {loading ? 'Creating Adventure...' : '✨ Start Your Adventure!'}
                                </button>
                            </div>
                        ) : (
                            /* Story Screen */
                            <div className="space-y-8">
                                <button
                                    onClick={() => setCurrentScreen('setup')}
                                    className="mb-4 px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors"
                                >
                                    ← Back to Setup
                                </button>

                                {/* Test button to generate adventure without setup */}
                                {frames.length === 0 && !loading && (
                                    <div className="bg-white rounded-xl shadow-xl p-8">
                                        <h2 className="text-2xl font-bold text-gray-900 mb-4 text-center">
                                            🎬 Create Your Animated Adventure
                                        </h2>
                                        <p className="text-gray-600 mb-6 text-center">
                                            Upload your drawing to see it come to life, or use text for quick testing
                                        </p>
                                        
                                        {/* Image Upload Section */}
                                        <div className="mb-6 p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg border-2 border-purple-200">
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                📸 Upload Your Drawing (Recommended - Animates YOUR Art!)
                                            </label>
                                            {!characterImage ? (
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={handleImageUpload}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-white"
                                                />
                                            ) : (
                                                <div className="space-y-3">
                                                    <img 
                                                        src={characterImage} 
                                                        alt="Your drawing" 
                                                        className="max-h-48 mx-auto rounded-lg border-2 border-purple-300 shadow-md"
                                                    />
                                                    <div className="flex items-center justify-center gap-2">
                                                        <p className="text-sm text-green-600 font-semibold">
                                                            ✓ Your drawing will animate in each scene!
                                                        </p>
                                                        <button
                                                            onClick={() => setCharacterImage(null)}
                                                            className="text-xs px-3 py-1 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors"
                                                        >
                                                            Clear
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="text-center text-gray-500 font-semibold mb-4">- OR -</div>

                                        {/* Text Input Section */}
                                        <div className="mb-6 p-4 bg-gradient-to-r from-blue-50 to-cyan-50 rounded-lg border-2 border-blue-200">
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                ✏️ Text Mode (Quick Testing - AI Creates Character)
                                            </label>
                                            <input
                                                type="text"
                                                value={characterName}
                                                onChange={(e) => setCharacterName(e.target.value)}
                                                placeholder="Character name (e.g., 'Luna the Space Cat')"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                            <textarea
                                                value={characterDescription}
                                                onChange={(e) => setCharacterDescription(e.target.value)}
                                                placeholder="Character description (e.g., 'A curious white cat with galaxy-patterned fur, sparkling eyes, wearing a tiny astronaut helmet')"
                                                rows="3"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                                            />
                                            {!characterImage && (characterName || characterDescription) && (
                                                <p className="text-xs text-center text-blue-600 font-semibold mt-2">
                                                    ℹ️ AI will create character from description
                                                </p>
                                            )}
                                        </div>

                                        <button
                                            onClick={startAdventure}
                                            disabled={!characterImage && !characterName && !characterDescription}
                                            className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 rounded-lg font-bold text-lg hover:from-purple-700 hover:to-pink-700 transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            🚀 Generate Adventure
                                        </button>
                                        <p className="text-xs text-center text-gray-500 mt-3">
                                            {characterImage 
                                                ? "🎨 Your drawing will animate with perfect consistency!" 
                                                : "⚡ Quick test mode - AI creates character from text"}
                                        </p>
                                    </div>
                                )}

                                {loading && (
                                    <div className="bg-purple-100 rounded-xl p-6 text-center">
                                        <div className="loading-spinner mx-auto mb-4"></div>
                                        <p className="text-purple-900 font-semibold">{loadingMessage}</p>
                                    </div>
                                )}

                                {/* Story Memory Panel */}
                                {frames.length > 0 && storyMemory.location && (
                                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-5 border-2 border-blue-200 shadow-lg">
                                        <h3 className="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                                            📖 Your Adventure So Far
                                        </h3>
                                        <div className="grid md:grid-cols-2 gap-4 text-sm">
                                            <div className="bg-white/70 rounded-lg p-3">
                                                <span className="font-semibold text-purple-700">📍 Location:</span>
                                                <span className="ml-2 text-gray-800">{storyMemory.location}</span>
                                            </div>
                                            <div className="bg-white/70 rounded-lg p-3">
                                                <span className="font-semibold text-purple-700">🎯 Goal:</span>
                                                <span className="ml-2 text-gray-800">{storyMemory.goal}</span>
                                            </div>
                                            {storyMemory.characters.length > 1 && (
                                                <div className="bg-white/70 rounded-lg p-3">
                                                    <span className="font-semibold text-purple-700">👥 Characters:</span>
                                                    <span className="ml-2 text-gray-800">{storyMemory.characters.join(', ')}</span>
                                                </div>
                                            )}
                                            {storyMemory.events.length > 0 && (
                                                <div className="bg-white/70 rounded-lg p-3">
                                                    <span className="font-semibold text-purple-700">✨ Recent:</span>
                                                    <span className="ml-2 text-gray-800">{storyMemory.events[storyMemory.events.length - 1]}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Story Frames - Storybook Style */}
                                <div className="space-y-8">
                                    {frames.map((frame, index) => (
                                        <div
                                            key={frame.id}
                                            className={`bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 rounded-2xl shadow-2xl overflow-hidden border-4 border-amber-200 comic-frame-${frame.animation}`}
                                            style={{ animationDelay: `${index * 0.2}s` }}
                                        >
                                            {/* Page Number Badge */}
                                            <div className="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-6 py-2 text-center">
                                                <span className="text-sm font-bold tracking-wider">✨ SCENE {index + 1} ✨</span>
                                            </div>

                                            <div className="grid md:grid-cols-2 gap-6 p-6">
                                                {/* Video Section */}
                                                <div className="relative">
                                                    <div className="rounded-xl overflow-hidden shadow-xl border-4 border-white">
                                                        <video
                                                            src={frame.videoUrl}
                                                            autoPlay
                                                            loop
                                                            muted
                                                            playsInline
                                                            className="w-full aspect-square object-cover"
                                                            onLoadedData={() => console.log(`Video ${index + 1} loaded`)}
                                                        >
                                                            Your browser doesn't support video playback.
                                                        </video>
                                                    </div>
                                                    {/* Decorative corners */}
                                                    <div className="absolute -top-2 -left-2 text-4xl">📖</div>
                                                    <div className="absolute -top-2 -right-2 text-4xl">✨</div>
                                                    <div className="absolute -bottom-2 -left-2 text-4xl">🌟</div>
                                                    <div className="absolute -bottom-2 -right-2 text-4xl">💫</div>
                                                </div>

                                                {/* Story Text Section */}
                                                <div className="flex flex-col justify-center space-y-4">
                                                    {/* Narrator Text */}
                                                    {frame.narrator && (
                                                        <div className="bg-white/80 backdrop-blur-sm rounded-xl p-5 shadow-lg border-2 border-amber-300">
                                                            <div className="flex items-start gap-3">
                                                                <span className="text-3xl flex-shrink-0">📚</span>
                                                                <p className="text-gray-800 leading-relaxed font-serif text-lg italic">
                                                                    {frame.narrator}
                                                                </p>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Character Dialogue */}
                                                    <div className="speech-bubble bg-gradient-to-br from-purple-100 to-pink-100 border-purple-300">
                                                        <div className="flex items-start gap-3">
                                                            <span className="text-2xl flex-shrink-0">💬</span>
                                                            <p className="text-gray-900 font-bold text-lg leading-relaxed">
                                                                "{frame.dialogue}"
                                                            </p>
                                                        </div>
                                                    </div>

                                                    {/* New Character Dialogue */}
                                                    {frame.newCharacterDialogue && (
                                                        <div className="speech-bubble bg-gradient-to-br from-emerald-100 to-teal-100 border-emerald-300">
                                                            <div className="flex items-start gap-3">
                                                                <span className="text-2xl flex-shrink-0">✨</span>
                                                                <div>
                                                                    {frame.newCharacterName && (
                                                                        <p className="text-emerald-700 font-bold text-sm mb-1">
                                                                            {frame.newCharacterName}
                                                                        </p>
                                                                    )}
                                                                    <p className="text-gray-900 font-bold text-lg leading-relaxed">
                                                                        "{frame.newCharacterDialogue}"
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Choices - Storybook Style */}
                                {!loading && choices.length > 0 && (
                                    <div className="bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 rounded-2xl shadow-2xl p-8 border-4 border-purple-200">
                                        <div className="text-center mb-6">
                                            <h3 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-2">
                                                ✨ What Happens Next? ✨
                                            </h3>
                                            <p className="text-gray-600 text-lg font-serif italic">
                                                Choose your adventure...
                                            </p>
                                        </div>
                                        <div className="grid md:grid-cols-3 gap-4">
                                            {choices.map((choice, idx) => (
                                                <button
                                                    key={choice.id}
                                                    onClick={() => handleChoiceClick(choice.text)}
                                                    className="group relative p-6 bg-white rounded-xl border-3 border-purple-300 hover:border-purple-500 hover:shadow-2xl transition-all transform hover:scale-105 text-left overflow-hidden"
                                                >
                                                    {/* Decorative background */}
                                                    <div className="absolute inset-0 bg-gradient-to-br from-purple-100/50 to-pink-100/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                    
                                                    {/* Choice number badge */}
                                                    <div className="absolute top-2 right-2 w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg">
                                                        {idx + 1}
                                                    </div>
                                                    
                                                    {/* Choice text */}
                                                    <div className="relative">
                                                        <div className="text-2xl mb-2">
                                                            {['🌟', '✨', '💫'][idx % 3]}
                                                        </div>
                                                        <p className="text-gray-900 font-bold text-lg leading-relaxed">
                                                            {choice.text}
                                                        </p>
                                                    </div>
                                                    
                                                    {/* Hover arrow */}
                                                    <div className="absolute bottom-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <span className="text-purple-600 text-xl">→</span>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Toast Notifications */}
                    {toast && (
                        <Toast
                            message={toast.message}
                            type={toast.type}
                            onClose={() => setToast(null)}
                        />
                    )}
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
